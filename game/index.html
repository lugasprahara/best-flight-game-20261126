<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Circuit — an island flight trial</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101623; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; box-shadow: 0 0 60px rgba(0,0,0,0.55); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Kestrel Circuit: fly the Kestrel K-1 through rings, collect fuel drums, dodge the storm line and land on the harbour runway. Steer with the arrow keys or the mouse, throttle with W and S."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script>
  // Fit the 1280x800 stage into the window without distorting it.
  (function fit() {
    var canvas = document.getElementById('game');
    function apply() {
      var scale = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
      canvas.style.width = Math.floor(1280 * scale) + 'px';
      canvas.style.height = Math.floor(800 * scale) + 'px';
    }
    window.addEventListener('resize', apply);
    apply();
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
